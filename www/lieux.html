<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application de Scan</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <script src="js/auth.js"></script>
  <body>
    <header class="bandeau">
      <div class="nom-lieu">Nom du Lieu</div>
      <!--appel nom lieu -->
      <div class="ping">Ping: 42ms</div>
    </header>
    <div class="container">
      <button class="btn">Créer nouveau membre</button>
      <button class="btn" id="scanBtn">Scanner une réservation</button>

      <button class="btn">Points de ventes</button>
      <button class="btn">Recharge carte cashless</button>
    </div>
    <script src="cordova.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("sw.js")
          .then(() => console.log("[SW] Service worker enregistré"))
          .catch((err) => console.warn("[SW] Erreur SW", err));
      }
    </script>

    <script>
      document.getElementById("scanBtn").addEventListener("click", function () {
        window.location.href = "events.html";
      });
    </script>

    <!-- <script src="js/index.js"></script> -->
  </body>
</html>
