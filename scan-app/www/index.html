<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application de Scan</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="bandeau">
      <div id="nom-lieu">Nom du Lieu</div>
      <!--appel nom lieu -->
      <div id="network-status" class="ping">...</div>
    </header>
    <main>
      <div class="container">
        <button id="startApp">Démarrer l'application</button>
      </div>
    </main>
    <script>
      document.getElementById("startApp").addEventListener("click", () => {
        const apiKey = localStorage.getItem("apiKey");

        if (apiKey) {
          window.location.href = "events.html";
        } else {
          window.location.href = "pairing.html";
        }
      });
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let registration of registrations) {
            registration.unregister().then(() => {
              console.log("✅ SW désinstallé");
            });
          }
        });
        caches.keys().then(function (names) {
          for (let name of names) {
            caches.delete(name);
          }
        });
      }
    </script>

    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
    <script src="js/noscroll.js"></script>
  </body>
</html>
